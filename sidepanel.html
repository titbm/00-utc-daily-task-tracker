<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Daily Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="header">
    <h2>📋 Daily Panel</h2>
    <button id="clearAll" class="clear-btn" title="Очистить все">🗑️</button>
  </div>
  
  <div class="content">
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">📄</div>
      <p class="empty-title">Панель пуста</p>
      <p class="hint">Щелкните правой кнопкой мыши на любой странице и выберите <strong>"Добавить в Daily Panel"</strong></p>
    </div>
    
    <div id="pagesList" class="pages-list"></div>
  </div>
  
  <div class="footer">
    <div class="counter">
      Страниц: <span id="pageCount">0</span>
    </div>
  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
