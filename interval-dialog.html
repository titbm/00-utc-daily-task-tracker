<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>⏰ Когда вернуть страницу?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    h1 {
      font-size: 28px;
      color: #212529;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .page-info {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 10px;
      margin: 24px 0;
      border-left: 4px solid #667eea;
    }
    
    .page-title {
      font-weight: 600;
      font-size: 16px;
      color: #495057;
      margin-bottom: 6px;
    }
    
    .page-url {
      font-size: 13px;
      color: #6c757d;
      word-break: break-all;
    }
    
    .time-inputs {
      display: flex;
      gap: 16px;
      margin: 24px 0;
      justify-content: center;
    }
    
    .time-input-group {
      flex: 1;
      max-width: 140px;
    }
    
    .time-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #495057;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .time-input {
      width: 100%;
      padding: 16px;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      font-size: 32px;
      font-weight: 600;
      text-align: center;
      color: #212529;
      transition: all 0.2s;
    }
    
    .time-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    
    .time-separator {
      font-size: 32px;
      font-weight: 600;
      color: #667eea;
      display: flex;
      align-items: flex-end;
      padding-bottom: 16px;
    }
    
    .quick-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    
    .quick-btn {
      padding: 12px;
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #495057;
      transition: all 0.2s;
    }
    
    .quick-btn:hover {
      background: #667eea;
      border-color: #667eea;
      color: white;
      transform: translateY(-2px);
    }
    
    .quick-btn:active {
      transform: translateY(0);
    }
    
    .confirm-btn {
      width: 100%;
      padding: 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    .confirm-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }
    
    .confirm-btn:active {
      transform: translateY(0);
    }
    
    .helper-text {
      text-align: center;
      font-size: 13px;
      color: #6c757d;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⏰ Когда вернуть страницу?</h1>
    
    <div class="page-info">
      <div class="page-title" id="pageTitle">Загрузка...</div>
      <div class="page-url" id="pageUrl"></div>
    </div>
    
    <div class="quick-buttons">
      <button class="quick-btn" data-hours="1" data-minutes="0">1 час</button>
      <button class="quick-btn" data-hours="2" data-minutes="0">2 часа</button>
      <button class="quick-btn" data-hours="4" data-minutes="0">4 часа</button>
      <button class="quick-btn" data-hours="8" data-minutes="0">8 часов</button>
      <button class="quick-btn" data-hours="12" data-minutes="0">12 часов</button>
      <button class="quick-btn" data-hours="24" data-minutes="0">24 часа</button>
    </div>
    
    <div class="time-inputs">
      <div class="time-input-group">
        <label class="time-label">Часы</label>
        <input type="number" id="hoursInput" class="time-input" min="0" value="24">
      </div>
      
      <div class="time-separator">:</div>
      
      <div class="time-input-group">
        <label class="time-label">Минуты</label>
        <input type="number" id="minutesInput" class="time-input" min="0" max="59" value="0">
      </div>
    </div>
    
    <button id="confirmBtn" class="confirm-btn">✓ Подтвердить</button>
    
    <p class="helper-text">Страница вернётся в активные через указанное время</p>
  </div>
  
  <script src="interval-dialog.js"></script>
</body>
</html>
