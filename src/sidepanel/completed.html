<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>All tasks completed | 00 UTC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <script src="../shared/roughNotation.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
      padding: 60px 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    
    .icon {
      font-family: 'Material Symbols Outlined';
      font-size: 80px;
      margin-bottom: 24px;
      animation: bounce 1s ease-in-out;
      font-variation-settings:
        'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 48;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    
    h1 {
      font-size: 28px;
      font-weight: 500;
      font-family: 'Outfit', 'Inter', sans-serif;
      color: #000000;
      margin-bottom: 16px;
    }
    
    p {
      font-size: 16px;
      color: #666666;
      margin-bottom: 32px;
    }
    
    .button {
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      padding: 14px 28px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .button .material-symbols-outlined {
      font-size: 20px;
      font-variation-settings:
        'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 20;
    }
    
    .button:hover {
      background: #333333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">celebration</div>
    <h1>All tasks <span id="strikethrough">not</span> completed!</h1>
    <p>Great work! All active links have been visited.</p>
    <button class="button" id="openPanelBtn">
      <span class="material-symbols-outlined">view_sidebar</span>
      Open Sidepanel
    </button>
  </div>
  
  <script src="completed.js"></script>
</body>
</html>
