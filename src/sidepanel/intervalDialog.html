<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>When to resume the task? | 00 UTC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <script src="../shared/roughNotation.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: center;
    }
    
    .header-icon {
      font-size: 28px;
      color: #000000;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 28;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 500;
      font-family: 'Outfit', 'Inter', sans-serif;
      color: #000000;
      margin: 0;
    }
    
    .page-info {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
      margin: 0 0 24px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    
    .page-info:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    
    .page-info:hover .page-title {
      text-decoration: underline;
    }
    
    .page-favicon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border-radius: 4px;
    }
    
    .page-details {
      flex: 1;
      min-width: 0;
    }
    
    .page-title {
      font-weight: 400;
      font-size: 14px;
      color: #000000;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .page-url {
      font-size: 12px;
      color: #999999;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .time-inputs {
      display: flex;
      gap: 16px;
      margin: 24px 0;
      justify-content: center;
    }
    
    .time-input-group {
      flex: 1;
      max-width: 140px;
    }
    
    .time-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #000000;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .time-input {
      width: 100%;
      padding: 16px;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      font-size: 32px;
      font-weight: 600;
      text-align: center;
      color: #000000;
      transition: all 0.2s;
      font-family: 'Inter', monospace;
    }
    
    .time-input:focus {
      outline: none;
      border-color: #000000;
    }
    
    .time-separator {
      font-size: 32px;
      font-weight: 600;
      color: #000000;
      display: flex;
      align-items: flex-end;
      padding-bottom: 16px;
    }
    
    .quick-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    
    .quick-btn {
      padding: 12px;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #000000;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    
    .quick-btn:hover {
      background: #000000;
      border-color: #000000;
      color: #ffffff;
    }
    
    .confirm-btn {
      width: 100%;
      padding: 14px;
      background: #000000;
      color: #ffffff;
      border: 1px solid #000000;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .confirm-btn .material-symbols-outlined {
      font-size: 20px;
    }
    
    .confirm-btn:hover {
      background: #333333;
    }
    
    .helper-text {
      text-align: center;
      font-size: 12px;
      color: #999999;
      margin-top: 16px;
    }
    
    /* Cycle indicator - черная луна на белом фоне */
    #cycle-indicator {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ffffff;
      border-radius: 8px;
      width: 56px;
      height: 56px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      cursor: default;
      transition: transform 0.2s ease;
    }
    
    #cycle-indicator.visible {
      display: flex;
    }
    
    #cycle-indicator:hover {
      transform: scale(1.1);
    }
    
    #cycle-indicator svg {
      animation: rotate 3s linear infinite;
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="material-symbols-outlined header-icon">schedule</span>
      <h1><span id="highlight">When to resume the task?</span></h1>
    </div>
    
    <a href="#" class="page-info" id="pageInfoLink">
      <img class="page-favicon" id="pageFavicon" src="" alt="">
      <div class="page-details">
        <div class="page-title" id="pageTitle">Loading...</div>
        <div class="page-url" id="pageUrl"></div>
      </div>
    </a>
    
    <div class="quick-buttons">
      <button class="quick-btn" data-hours="1" data-minutes="0">1 hour</button>
      <button class="quick-btn" data-hours="8" data-minutes="0">8 hours</button>
      <button class="quick-btn" data-hours="12" data-minutes="0">12 hours</button>
      <button class="quick-btn" data-hours="24" data-minutes="0">24 hours</button>
      <button class="quick-btn" data-hours="168" data-minutes="0">7 days</button>
      <button class="quick-btn" data-hours="744" data-minutes="0">31 days</button>
    </div>
    
    <div class="time-inputs">
      <div class="time-input-group">
        <label class="time-label">Hours</label>
        <input type="number" id="hoursInput" class="time-input" min="0" value="24">
      </div>
      
      <div class="time-separator">:</div>
      
      <div class="time-input-group">
        <label class="time-label">Minutes</label>
        <input type="number" id="minutesInput" class="time-input" min="0" max="59" value="0">
      </div>
    </div>
    
    <button id="confirmBtn" class="confirm-btn">
      <span class="material-symbols-outlined">check</span>
      Confirm
    </button>
    
    <p class="helper-text">The task will resume after the specified time</p>
  </div>
  
  <!-- Cycle indicator (показывается только когда открыт из цикла) -->
  <div id="cycle-indicator" title="Task cycle is running">
    <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#000000">
      <path d="M376-140q140.07 0 238.53-98Q713-336 713-480t-99.5-242Q514-820 374-820q-20 0-41 2t-32 5q64 72 98 157t34 176q0 91-34 176.5T302-148q11 3 31 5.5t43 2.5Zm5 60q-54.38 0-106.19-13Q223-106 188-126q88-66 136.5-158T373-479.5Q373-583 324-676T187-833q35-20 87.47-33.5T382-880q80.83 0 151.91 30.5Q605-819 658.5-765.5t84 126.5Q773-566 773-481t-30.95 158.29q-30.94 73.28-84 127.5Q605-141 533.59-110.5 462.19-80 381-80Zm52-399Z"/>
    </svg>
  </div>
  
  <script src="intervalDialog.js"></script>
</body>
</html>
