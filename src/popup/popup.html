<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    body {
      width: 200px;
      margin: 0;
      padding: 16px;
      font-family: 'Inter', system-ui, sans-serif;
      background: #ffffff;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 0 0 12px 0;
      margin-bottom: 12px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 14px;
      color: #666666;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .stat-label {
      color: #666666;
    }
    
    .stat-value {
      font-weight: 600;
      color: #000000;
    }
    
    .stat-separator {
      color: #999999;
      margin: 0 4px;
    }
    
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    
    button:hover {
      background: #f5f5f5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 1px solid #e5e5e5;
      margin-top: 8px;
    }
    
    .setting-label {
      font-size: 14px;
      font-weight: 500;
      color: #000000;
    }
    
    /* Switch Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #e5e5e5;
      transition: 0.3s;
      border-radius: 18px;
      border: 1px solid #e5e5e5;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 1px;
      bottom: 1px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #000000;
      border-color: #000000;
    }
    
    input:checked + .slider:before {
      transform: translateX(14px);
    }
    
    input:disabled + .slider {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    button .material-symbols-outlined {
      font-size: 18px;
      font-variation-settings:
        'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 24;
    }
    
    button#stealthMode {
      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }
    
    button#stealthMode:hover {
      background: #333333;
      border-color: #333333;
    }
    
    button:hover {
      background: #f5f5f5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    
    button#stealthMode:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">Active:</span>
      <span class="stat-value" id="activeCount">0</span>
    </div>
    <span class="stat-separator">•</span>
    <div class="stat-item">
      <span class="stat-label">Completed:</span>
      <span class="stat-value" id="completedCount">0</span>
    </div>
  </div>
  
  <button id="stealthMode">
    <span class="material-symbols-outlined">play_arrow</span>
    Start
  </button>
  <button id="addCurrentTab">
    <span class="material-symbols-outlined">add</span>
    Add current tab
  </button>
  <button id="openPanel">
    <span class="material-symbols-outlined">view_sidebar</span>
    Sidepanel
  </button>
  
  <div class="setting-item">
    <span class="setting-label">Notification mode</span>
    <label class="switch">
      <input type="checkbox" id="bannerToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
