<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/popup.css">
</head>
<body>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">Active:</span>
      <span class="stat-value" id="activeCount">0</span>
    </div>
    <span class="stat-separator">•</span>
    <div class="stat-item">
      <span class="stat-label">Completed:</span>
      <span class="stat-value" id="completedCount">0</span>
    </div>
  </div>
  
  <div class="split-button" id="checkResetButtons" style="display: none;">
    <button id="checkTasks" class="split-left check-reset-btn check-btn-80" title="Reset tasks restoring within 24h and start cycle">
      <span class="material-symbols-outlined">check</span>
      Check tasks
    </button>
    <button id="resetTasks" class="split-right reset-btn-20" title="Reset all completed tasks to active">
      <span class="material-symbols-outlined">refresh</span>
    </button>
  </div>
  
  <button id="stealthMode" title="Start task cycle">
    <span class="material-symbols-outlined">play_arrow</span>
    Start
  </button>
  <button id="addCurrentTab" title="Add current page to active tasks">
    <span class="material-symbols-outlined">add</span>
    Add current tab
  </button>
  <button id="openPanel" title="Open side panel with all tasks">
    <span class="material-symbols-outlined">view_sidebar</span>
    Sidepanel
  </button>
  
  <div class="split-button">
    <button id="importData" class="split-left" title="Import tasks from JSON file">
      <span class="material-symbols-outlined">upload</span>
      Import
    </button>
    <button id="exportData" class="split-right" title="Export all tasks to JSON file">
      <span class="material-symbols-outlined">download</span>
      Export
    </button>
  </div>
  
  <div class="setting-item">
    <span class="setting-label">Notification mode</span>
    <label class="switch">
      <input type="checkbox" id="bannerToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <!-- Hidden file input for import -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;">
  
  <script type="module" src="popup.js"></script>
</body>
</html>
